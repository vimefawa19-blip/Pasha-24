<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d16">
<title>Pasha 24</title>
<style>
:root{--bg:#090d16;--panel:#121a29;--panel2:#182337;--text:#f4f7ff;--muted:#9aa8bd;--accent:#7c5cff;--line:#26334a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Bengali",sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:#090d16ed;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.brand{font-size:24px;font-weight:900}.brand span{color:#9d89ff}.tag{font-size:10px;color:var(--muted);letter-spacing:1px}
.avatar{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#7c5cff,#24c6dc);display:grid;place-items:center;font-weight:900}
main{max-width:620px;margin:auto;padding:15px}.welcome,.composer,.post,.profile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}
.welcome{background:linear-gradient(135deg,#21194b,#14283b)}h1{font-size:21px;margin:0 0 6px}.muted{color:var(--muted);font-size:12px}
textarea,input,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;margin-top:10px}
textarea{min-height:85px}.controls,.actions,.tabs{display:flex;gap:8px;margin-top:10px}.btn,.chip,.action{border:0;border-radius:11px;padding:10px 12px;background:var(--panel2);color:var(--text);font-weight:700;font:inherit}
.primary{background:var(--accent);color:white;flex:1}.chip.active{background:var(--accent)}.chips{display:flex;gap:8px;overflow:auto;margin:10px 0 16px}.post-head{display:flex;align-items:center;gap:10px}.post-text{white-space:pre-wrap;line-height:1.6;margin:12px 0}.post-media{width:100%;max-height:380px;object-fit:contain;border-radius:12px;margin-top:10px}.actions .action{flex:1;font-size:12px}.liked{color:#ff7d9c}.comment{background:var(--panel2);padding:9px;border-radius:10px;margin-top:7px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d1422f2;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px;z-index:2}.navitem{background:none;border:0;color:var(--muted);font:inherit;font-size:12px}.navitem.active{color:#b4a6ff}
#toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#283653;padding:10px 15px;border-radius:10px;display:none;z-index:5}
</style>

<style>
:root{--bg:#0b0b0c;--panel:#151515;--panel2:#20201e;--text:#f7f2e8;--muted:#aaa397;--accent:#c9a45c;--line:#393124}
body{background:radial-gradient(ellipse at 50% -15%,#332719 0%,#11100e 42%,#090909 78%);font-family:system-ui,"Noto Sans Bengali",sans-serif}
header{background:rgba(10,10,10,.94);border-bottom:1px solid #6b542d;box-shadow:0 8px 30px #0008}
.brand{letter-spacing:.5px}.brand span{color:#e0bd76}
.tag{color:#c5b58f;letter-spacing:1.6px}
.avatar{background:linear-gradient(145deg,#e2c27b,#8c6428);color:#17120a;box-shadow:0 5px 18px #c9a45c30}
.welcome{background:linear-gradient(125deg,#302416,#171512 72%);border:1px solid #806333;box-shadow:inset 0 1px #ffffff12,0 12px 30px #0005}
.welcome h1{color:#f5e8c9;letter-spacing:.1px}
.composer,.post,.profile{background:linear-gradient(145deg,#191817,#111);border:1px solid #403625;box-shadow:0 12px 28px #0005}
textarea,input,select{background:#201e1a;border-color:#51432b;color:#fff8e8}
textarea:focus,input:focus,select:focus{outline:1px solid #c9a45c}
.btn,.chip,.action{background:#24211b;color:#e9dfc9;border:1px solid #51432b}
.primary,.chip.active{background:linear-gradient(120deg,#d9b66d,#9d7435);border:1px solid #e5c77f;color:#17120a;box-shadow:0 5px 18px #c9a45c28}
.post-media{border:1px solid #5b4828;box-shadow:0 8px 24px #0007}
nav{background:rgba(12,11,10,.97);border-top:1px solid #6b542d;backdrop-filter:blur(16px)}
.navitem.active{color:#e3c27c}
#toast{background:#3b2d18;border:1px solid #9a763b;color:#fff4d8}
::selection{background:#b58b45;color:#100d08}
</style>

</head>
<body>
<header><div><div class="brand">পাশা <span>24</span></div><div class="tag">ENTERTAINMENT • NEWS • FUN</div></div><div class="avatar" id="headAvatar">P</div></header>
<main>
<section id="home">
<div class="welcome"><h1>স্বাগতম Pasha 24-এ 👋</h1><div class="muted">বিনোদন, খেলাধুলা ও মজার পোস্ট শেয়ার করো।</div></div>
<div style="font-weight:800">এক্সপ্লোর করো</div>
<div class="chips"><button class="chip active" onclick="filterCat('সব',this)">সব</button><button class="chip" onclick="filterCat('বিনোদন',this)">বিনোদন</button><button class="chip" onclick="filterCat('খেলাধুলা',this)">খেলাধুলা</button><button class="chip" onclick="filterCat('মজার পোস্ট',this)">মজার পোস্ট</button></div>
<section class="composer"><div style="font-weight:800" id="who">অতিথি ইউজার</div><textarea id="postText" placeholder="তোমার পোস্ট লিখো..."></textarea><div class="controls"><select id="category"><option>বিনোদন</option><option>খেলাধুলা</option><option>মজার পোস্ট</option></select><label class="btn">📷 ছবি<input id="photo" type="file" accept="image/*" hidden></label><button class="btn primary" onclick="publish()">🚀 পোস্ট করো</button></div><div id="preview"></div></section>
<div style="font-weight:800;margin:16px 2px">সর্বশেষ পোস্ট <span class="muted" id="count"></span></div><div id="feed"></div>
</section>
<section id="profile" hidden><div class="profile"><h2>আমার প্রোফাইল</h2><input id="name" placeholder="তোমার নাম"><button class="btn primary" onclick="saveName()">নাম সেভ করো</button><p class="muted">এই ডেমোতে পোস্ট ও নাম এই ব্রাউজারেই সংরক্ষিত থাকবে।</p></div></section>
</main>
<nav><button class="navitem active" onclick="tab('home',this)">⌂ হোম</button><button class="navitem" onclick="filterCat('বিনোদন');tab('home',this)">▷ ভিডিও</button><button class="navitem" onclick="filterCat('খেলাধুলা');tab('home',this)">⚽ খেলা</button><button class="navitem" onclick="tab('profile',this)">◉ প্রোফাইল</button></nav>
<div id="toast"></div>
<script>
let userName=localStorage.getItem('p24name')||'অতিথি ইউজার',photoData='',categoryFilter='সব';
let posts=JSON.parse(localStorage.getItem('p24posts')||'[]');
const starter=[{id:'s1',name:'Pasha 24 Official',text:'বিনোদনের নতুন ঠিকানা—Pasha 24! 😎',cat:'বিনোদন',likes:[],comments:[],time:Date.now()-3000},{id:'s2',name:'Pasha 24 Sports',text:'খেলার দুনিয়ার আড্ডা চলুক Pasha 24-এ! ⚽🏏',cat:'খেলাধুলা',likes:[],comments:[],time:Date.now()-6000},{id:'s3',name:'Pasha 24 Fun',text:'বন্ধু যখন বলে ৫ মিনিটে আসছি—তারপর ১ ঘণ্টা পার! 😂',cat:'মজার পোস্ট',likes:[],comments:[],time:Date.now()-9000}];
function save(){localStorage.setItem('p24posts',JSON.stringify(posts))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
document.getElementById('who').textContent=userName;document.getElementById('headAvatar').textContent=userName[0].toUpperCase();document.getElementById('name').value=userName;
document.getElementById('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>1800000){toast('ছবিটি ১.৮ MB-এর চেয়ে ছোট দিন');return}let r=new FileReader();r.onload=()=>{photoData=r.result;document.getElementById('preview').innerHTML='<img class="post-media" src="'+photoData+'">'};r.readAsDataURL(f)};
function publish(){let t=document.getElementById('postText').value.trim();if(!t&&!photoData){toast('কিছু লিখুন অথবা ছবি দিন');return}posts.unshift({id:String(Date.now()),name:userName,text:t,cat:document.getElementById('category').value,image:photoData,likes:[],comments:[],time:Date.now()});save();document.getElementById('postText').value='';document.getElementById('photo').value='';document.getElementById('preview').innerHTML='';photoData='';render();toast('পোস্ট তৈরি হয়েছে')}
function render(){let all=[...posts,...starter];let shown=all.filter(p=>categoryFilter==='সব'||p.cat===categoryFilter);document.getElementById('count').textContent='('+shown.length+'টি)';document.getElementById('feed').innerHTML=shown.map(p=>`<article class="post"><div class="post-head"><div class="avatar">${esc(p.name[0]||'P')}</div><div><b>${esc(p.name)}</b><div class="muted">${esc(p.cat)} • ${new Date(p.time).toLocaleString('bn-BD')}</div></div></div>${p.text?`<div class="post-text">${esc(p.text)}</div>`:''}${p.image?`<img class="post-media" src="${p.image}">`:''}<div class="actions"><button class="action" onclick="like('${p.id}')">♡ লাইক (${p.likes.length})</button><button class="action" onclick="comment('${p.id}')">💬 মন্তব্য (${p.comments.length})</button><button class="action" onclick="sharePost()">↗ শেয়ার</button></div>${p.comments.map(c=>`<div class="comment"><b>${esc(c.name)}:</b> ${esc(c.text)}</div>`).join('')}</article>`).join('')||'<div class="post">এখনো কোনো পোস্ট নেই।</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function like(id){let p=posts.find(x=>x.id===id)||starter.find(x=>x.id===id);if(!p)return;p.likes.push('me');render();if(posts.includes(p))save()}
function comment(id){let p=posts.find(x=>x.id===id)||starter.find(x=>x.id===id);let t=prompt('তোমার মন্তব্য লিখো');if(t&&t.trim()){p.comments.push({name:userName,text:t.trim()});if(posts.includes(p))save();render()}}
function filterCat(c,el){categoryFilter=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');render()}
function saveName(){userName=document.getElementById('name').value.trim()||'অতিথি ইউজার';localStorage.setItem('p24name',userName);document.getElementById('who').textContent=userName;document.getElementById('headAvatar').textContent=userName[0].toUpperCase();toast('নাম সেভ হয়েছে')}
function tab(t,el){document.getElementById('home').hidden=t!=='home';document.getElementById('profile').hidden=t!=='profile';document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active')}
function sharePost(){if(navigator.share)navigator.share({title:'Pasha 24',text:'Pasha 24 দেখো'}).catch(()=>{});else toast('শেয়ার অপশন এই ব্রাউজারে নেই')}
render();
</script>
</body>
</html>
